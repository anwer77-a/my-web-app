<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الاسم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- مكتبة تيليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            margin: auto;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0088cc;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>اكتب اسمك</h2>

    <input id="name" type="text" placeholder="الاسم">

    <button onclick="sendName()">تسجيل</button>
</div>

<script>
    // تفعيل Web App
    const tg = window.Telegram.WebApp;
    tg.ready();

    // هذه الدالة ترسل الاسم للبوت
    function sendName() {
        const name = document.getElementById("name").value.trim();

        if (name === "") {
            alert("اكتب اسمك أولًا");
            return;
        }

        // نرسل الاسم فقط
        tg.sendData(JSON.stringify({
            name: name
        }));
    }
</script>

</body>
</html>    <div class="input-group">
        <input type="text" id="name" placeholder="الاسم الكامل">
    </div>

    <button onclick="sendData()">تأكيد التسجيل</button>

    <div class="footer">
        Web App by Anwar Hamza
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function sendData() {
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();

        if (!name || !phone) {
            alert("رجاءً أدخل الاسم ورقم الهاتف");
            return;
        }

        const data = {
            name: name,
            phone: phone
        };

        tg.sendData(JSON.stringify(data));
    }
</script>

</body>
</html>
