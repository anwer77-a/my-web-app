<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل المستخدم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 20px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 14px;
            padding: 20px;
            max-width: 420px;
            margin: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #0088cc;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل البيانات 📝</h2>

    <input type="text" id="name" placeholder="الاسم الكامل">
    <input type="tel" id="phone" placeholder="رقم الهاتف">

    <button onclick="sendData()">إرسال</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function sendData() {
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();

        if (!name || !phone) {
            alert("رجاءً املأ جميع الحقول");
            return;
        }

        const data = {
            name: name,
            phone: phone
        };

        tg.sendData(JSON.stringify(data));
    }
</script>

</body>
</html>
